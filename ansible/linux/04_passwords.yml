# 04_passwords.yml - give every account that can log in a new random password.
#
# Never touched:
#   - scored_users and skip_users (inventory/group_vars/all.yml)
#   - locked accounts ('!' or '*' in /etc/shadow, e.g. Ubuntu's root).
#     Setting a password on those would UNLOCK them.
#   - the account Ansible logs in with, unless you add -e rotate_login_user=true
#
#   ansible-playbook 04_passwords.yml -K --check     # dry run: shows who would change
#   ansible-playbook 04_passwords.yml -K             # do it
#   ansible-playbook 04_passwords.yml -K -e rotate_login_user=true
#       ^ only after 03_keys.yml said KEY LOGIN OK for that box. On the debian
#         group the login user's password is also the sudo password: use the
#         new one with -K from then on.
#
# New passwords: loot/passwords/<host>-<time>.csv (host,user,password), mode 0600.
# Copy them into the team tracker + Change Log right away.

- name: Rotate passwords on login-capable accounts
  hosts: linux
  become: true
  gather_facts: false
  vars:
    rotate_login_user: false
    pw_length: 16
  tasks:
    - name: Pick one timestamp for this run
      ansible.builtin.set_fact:
        pw_stamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
      run_once: true

    - name: Make the local folder for the password files
      ansible.builtin.file:
        path: "{{ playbook_dir }}/loot/passwords"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Accounts with a real login shell
      ansible.builtin.shell: awk -F':' '$7 !~ /(nologin|false|sync|shutdown|halt)$/ {print $1}' /etc/passwd
      register: login_users
      changed_when: false
      check_mode: false

    - name: Accounts that are NOT locked in /etc/shadow
      ansible.builtin.shell: awk -F':' '$2 !~ /^[!*]/ {print $1}' /etc/shadow
      register: unlocked_users
      changed_when: false
      check_mode: false

    - name: Work out the list
      ansible.builtin.set_fact:
        rotate_list: >-
          {{ login_users.stdout_lines
             | intersect(unlocked_users.stdout_lines)
             | difference(scored_users + skip_users)
             | difference([] if (rotate_login_user | bool) else [ansible_user]) }}

    - name: Show who changes and who is left alone
      ansible.builtin.debug:
        msg:
          - "CHANGING: {{ rotate_list | join(', ') if rotate_list else '(nobody)' }}"
          - "skipped (scored/skip list): {{ login_users.stdout_lines | intersect(scored_users + skip_users) | join(', ') or '-' }}"
          - "skipped (locked): {{ login_users.stdout_lines | difference(unlocked_users.stdout_lines) | join(', ') or '-' }}"
          - "login user {{ ansible_user }}: {{ 'CHANGING' if (rotate_login_user | bool) else 'kept (add -e rotate_login_user=true after key login works)' }}"

    - name: Generate a password per account (letters + digits, easy to type)
      ansible.builtin.set_fact:
        new_pw: "{{ new_pw | default({}) | combine({item: lookup('password', '/dev/null', length=pw_length, chars=['ascii_letters', 'digits'])}) }}"
      loop: "{{ rotate_list }}"
      no_log: true

    - name: Save them on the control node FIRST, so a crash can't lose them
      ansible.builtin.copy:
        content: |
          {% for u in rotate_list %}
          {{ inventory_hostname }},{{ u }},{{ new_pw[u] }}
          {% endfor %}
        dest: "{{ playbook_dir }}/loot/passwords/{{ inventory_hostname }}-{{ pw_stamp }}.csv"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      when: rotate_list | length > 0

    - name: Set the new passwords
      ansible.builtin.user:
        name: "{{ item }}"
        password: "{{ new_pw[item] | password_hash('sha512') }}"
        update_password: always
      loop: "{{ rotate_list }}"
      loop_control:
        label: "{{ item }}"          # print the username only, never the password

    - name: Where to find them
      ansible.builtin.debug:
        msg: "{{ rotate_list | length }} password(s) in loot/passwords/{{ inventory_hostname }}-{{ pw_stamp }}.csv - put them in the tracker now"
      when: rotate_list | length > 0
