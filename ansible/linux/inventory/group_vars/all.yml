# group_vars/all.yml - team-wide settings every playbook reads.
# Edit the FILL IN lines at 9:00. Everything else has a safe default.

# --- SSH key (made the night before: ssh-keygen -t ed25519 -f ~/.ssh/inv3) ---
# Ansible offers this key first and falls back to the password (-k) until
# 03_keys.yml has put the public half on each box.
ansible_ssh_private_key_file: ~/.ssh/inv3
team_pubkey_file: "{{ playbook_dir }}/files/team_key.pub"

# --- FILL IN: accounts the scoring engine (Quotient) logs in with ---
# 04_passwords.yml NEVER touches these. Change them only through Quotient.
scored_users: []
#  - jsmith
#  - posuser

# --- FILL IN (optional): other accounts to leave alone ---
skip_users: []

# --- Backups (02_backup.yml): folders copied if they exist on the box ---
backup_paths:
  - /etc
  - /root
  - /var/www
  - /srv
  - /opt
  - /var/lib/gitea
  - /usr/local/etc
# Archives bigger than this (MB) stay on the box instead of being copied
backup_max_mb: 400

# --- Wazuh (06_wazuh.yml) ---
# FILL IN: the internal IP of the box in [wazuh_manager]
wazuh_manager_ip: "CHANGE_ME"
# FILL IN: agents must know this to register. Or pass -e wazuh_enroll_password=...
wazuh_enroll_password: "CHANGE_ME"
# IPs Wazuh must never auto-block (scoring engine, your own machines)
wazuh_whitelist_ips: []
# Accept syslog from the OpenWRT router (vigra) on UDP 514
wazuh_router_syslog_ip: "192.168.220.2"
