# Team 12 - WCComps 2026 Invitational 3 (Flokid)
# Source: team tracker sheet (packet p.3-4). Internal 192.168.220.0/24.
# External = 10.100.112.<last octet> (1:1 NAT). If your control node sits
# OUTSIDE the internal network, swap ansible_host to the 10.100.112.x address.
# Packet warns there may be UNLISTED servers - add them here when found.

# ---- Linux, by package family (decides apt vs dnf vs apk) ----
[debian]
haf        ansible_host=192.168.220.67    # Lubuntu 22      - Wabbit
kvigindis  ansible_host=192.168.220.44    # Ubuntu 24.04    - Furniture Help Site
djupi      ansible_host=192.168.220.222   # Linux Mint 22.3 - Point of Sale

[rhel]
gufu       ansible_host=192.168.220.100   # Rocky Linux     - Gitea
thorska    ansible_host=192.168.220.231   # Fedora 44       - Home Manager

[alpine]
kolla      ansible_host=192.168.220.30    # Alpine          - Fileshare
skerja     ansible_host=192.168.220.97    # Alpine 3.23     - Employee + Customer Tickets

[linux:children]
debian
rhel
alpine

# ---- Kept OUT of [linux] on purpose ----
# OpenWRT: no Python by default, and it's the router for every box. Hand-manage
# it (LuCI/SSH); only use '-m raw' on it, and only if you're sure.
[network]
vigra      ansible_host=192.168.220.2     # OpenWRT - router/firewall

# Windows is your Windows teammates' call (needs WinRM + ansible.windows).
[windows]
borgar     ansible_host=192.168.220.10    # Server 2022 - Food Ordering
vattar     ansible_host=192.168.220.79    # Server 2019 - Active Directory DC

# ---- Connection settings: fill in at 9:00 when creds are handed out ----
[debian:vars]
# Ubuntu/Lubuntu/Mint usually have root locked -> log in as the sudo user.
ansible_user=CHANGE_ME_SUDO_USER
ansible_become=true

[rhel:vars]
ansible_user=root

[alpine:vars]
ansible_user=root
# Often no Python on Alpine. Bootstrap first:
#   ansible alpine -m raw -a 'apk add python3' -k

[network:vars]
ansible_user=root

# ---- Wazuh manager: put the ONE box you chose here (most free RAM, not Alpine) ----
# Check RAM with: ansible-playbook 00_bootstrap.yml   (it prints RAM/CPU per box)
[wazuh_manager]
