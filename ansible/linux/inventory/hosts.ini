# inventory/hosts.ini - FILL IN at the start, from the team packet / tracker sheet.
# One line per box:  <name>  ansible_host=<IP the control node can reach>   # OS - service
# Remove the leading '# ' from an example line to use it. Hosts nobody listed (the packet often
# warns about UNLISTED servers) get added here when you find them.
# If the control node sits OUTSIDE the internal network, use the external (NAT) addresses.

# ---- Linux, by package family (decides apt vs dnf vs apk) ----
[debian]
# web01      ansible_host=192.0.2.10    # Ubuntu 24.04 - Website

[rhel]
# db01       ansible_host=192.0.2.20    # Rocky 9 - Database
# Old Python on a box? Point at a newer one:  ansible_python_interpreter=/usr/bin/python3.11

[alpine]
# files01    ansible_host=192.0.2.30    # Alpine - Fileshare

[linux:children]
debian
rhel
alpine

# ---- Kept OUT of [linux] on purpose ----
# OpenWRT / network gear: no Python by default, and it's the router for every box. Hand-manage
# it (LuCI/SSH); only use '-m raw' on it, and only if you're sure.
[network]
# router     ansible_host=192.0.2.1     # OpenWRT - router/firewall

# Windows is your Windows teammates' call (needs WinRM + ansible.windows).
[windows]
# dc01       ansible_host=192.0.2.40    # Server 2022 - Active Directory DC

# ---- Connection settings ----
[debian:vars]
# Ubuntu/Mint often have root locked -> log in as the sudo user and add -K to commands.
ansible_user=root
ansible_become=true

[rhel:vars]
ansible_user=root

[alpine:vars]
ansible_user=root
# Often no Python on Alpine. 00_bootstrap.yml installs it (needs the Alpine mirror).

[network:vars]
ansible_user=root

# ---- Wazuh manager: put the ONE box you chose here (most free RAM, not Alpine) ----
# Check RAM with: ansible-playbook 00_bootstrap.yml   (it prints RAM/CPU per box)
[wazuh_manager]
