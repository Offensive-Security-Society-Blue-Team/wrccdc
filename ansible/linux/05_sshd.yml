# 05_sshd.yml - safe SSH server hardening.
#
# Puts a short block at the TOP of /etc/ssh/sshd_config. sshd uses the FIRST
# value it reads for most settings, so this block beats anything below it,
# including drop-in files red team may have planted in sshd_config.d/.
# Every change is checked with 'sshd -t' first; a bad config is never saved.
#
# Deliberately NOT changed: PasswordAuthentication (Quotient may log in with a
# password) and PermitRootLogin (unless you set it below).
#
#   ansible-playbook 05_sshd.yml -K --check --diff -l haf   # preview one box
#   ansible-playbook 05_sshd.yml -K -l haf                  # one box, then check scoring
#   ansible-playbook 05_sshd.yml -K                         # everyone
#   ... -e ssh_permit_root_login=prohibit-password          # root: keys only
#
# Keep a second SSH session open to the box until you've logged in again.

- name: Harden sshd without breaking scored logins
  hosts: linux
  become: true
  gather_facts: true
  vars:
    ssh_permit_root_login: ""        # "" = leave alone
    sshd_block: |
      PermitEmptyPasswords no
      PermitUserEnvironment no
      X11Forwarding no
      AllowTcpForwarding no
      AllowAgentForwarding no
      PermitTunnel no
      AuthorizedKeysFile .ssh/authorized_keys
      AuthorizedKeysCommand none
  tasks:
    - name: Put the blue-team block at the top of sshd_config (validated with sshd -t)
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        insertbefore: BOF
        marker: "# {mark} BLUE TEAM BLOCK - first match wins, these lines beat everything below"
        block: "{{ sshd_block }}{{ 'PermitRootLogin ' ~ ssh_permit_root_login if ssh_permit_root_login else '' }}"
        validate: /usr/sbin/sshd -t -f %s
        backup: true
      notify: Reload sshd

    - name: Reload sshd now, not at the end of the play
      ansible.builtin.meta: flush_handlers

    - name: Show the settings sshd is really using now
      ansible.builtin.shell: >-
        /usr/sbin/sshd -T 2>/dev/null |
        grep -iE '^(permitemptypasswords|permitrootlogin|passwordauthentication|authorizedkeysfile|authorizedkeyscommand|allowtcpforwarding|x11forwarding) '
      register: effective
      changed_when: false
      check_mode: false

    - name: Effective sshd settings
      ansible.builtin.debug:
        var: effective.stdout_lines

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
        state: reloaded
