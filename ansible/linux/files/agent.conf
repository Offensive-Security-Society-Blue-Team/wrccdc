<!--
  agent.conf - CCDC monitoring config. The manager pushes this file to EVERY
  agent automatically (/var/ossec/etc/shared/default/agent.conf), so you never
  edit agents one by one. Change it here, then re-run 06_wazuh.yml with the "config" tag.
-->
<agent_config>

  <!-- File integrity monitoring (FIM): realtime = alert within seconds.
       report_changes = the alert shows the actual diff (e.g. the line added to sudoers). -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>900</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- accounts and privileges -->
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/passwd,/etc/group,/etc/sudoers,/etc/sudoers.d</directories>
    <directories realtime="yes" check_all="yes">/etc/shadow,/etc/gshadow</directories>

    <!-- SSH: server config and keys -->
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/ssh</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/root/.ssh</directories>

    <!-- scheduled jobs and services (persistence) -->
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/crontab,/etc/cron.d,/etc/cron.hourly,/etc/cron.daily,/etc/cron.weekly,/etc/cron.monthly</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/var/spool/cron,/etc/crontabs</directories>
    <directories realtime="yes" check_all="yes">/etc/systemd/system,/etc/init.d,/etc/local.d,/etc/rc.local</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/profile,/etc/profile.d,/etc/bash.bashrc,/etc/ld.so.preload</directories>

    <!-- user homes (planted keys, .bashrc hooks) and web roots (web shells) -->
    <directories realtime="yes" check_all="yes">/home</directories>
    <directories realtime="yes" check_all="yes">/var/www</directories>

    <!-- system binaries: scheduled scan only (trojaned binaries) -->
    <directories check_all="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>

    <ignore type="sregex">\.log$|\.swp$|\.cache/|/\.local/share/</ignore>
  </syscheck>

  <!-- Logs: logins, sudo, su (one of these exists on each distro; missing ones are skipped) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <!-- Web server access logs: attacks against the scored sites -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/httpd/access_log</location>
  </localfile>

</agent_config>
